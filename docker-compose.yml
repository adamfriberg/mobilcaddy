services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobilcaddy
      POSTGRES_USER: mobilcaddy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mobilcaddy_db_data:/var/lib/postgresql/data
    networks:
      - internal

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mobilcaddy:${DB_PASSWORD}@db:5432/mobilcaddy
      PORT: 3000
    depends_on:
      - db
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8090:8090"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - mobilcaddy_caddy_data:/data
      - mobilcaddy_caddy_config:/config
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    name: mobilcaddy_internal

volumes:
  mobilcaddy_db_data:
  mobilcaddy_caddy_data:
  mobilcaddy_caddy_config:
